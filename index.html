        if (newBubbles.every(b => b.hp <= 0)) setTimeout(() => setShowPopup(true), 1500); 
      };

      const handleSelectPartnerTopic = (topic) => {
        if (partnerTopics.find(t => t.id === topic.id)) setPartnerTopics(partnerTopics.filter(t => t.id !== topic.id));
        else if (partnerTopics.length < 3) setPartnerTopics([...partnerTopics, topic]);
      };

      const handleSendToSupabase = async () => {
        if(!partnerName.trim() || !reasons.r1 || !reasons.r2 || !reasons.r3) { alert("빈칸을 모두 채워주세요!"); return; }
        setIsSending(true);
        try {
          // DB 스키마 변경 없이 두 주제를 | 로 묶어서 전송 (대시보드에서 파싱)
          const combinedBaseTopic = `${baseTopics[0].label}|${baseTopics[1].label}`;

          const { error } = await supabase.from('media_trays').insert([{
            user_name: userName,
            partner_name: partnerName,
            base_topic: combinedBaseTopic,
            topic_1: partnerTopics[0] ? partnerTopics[0].label : '',
            reason_1: reasons.r1,
            topic_2: partnerTopics[1] ? partnerTopics[1].label : '',
            reason_2: reasons.r2,
            topic_3: partnerTopics[2] ? partnerTopics[2].label : '',
            reason_3: reasons.r3
          }]);
          if (error) throw error; 
          confetti({ particleCount: 200, spread: 100, origin: { y: 0.6 }, zIndex: 9999 });
          onUnlock(); 
          setStage('done');
        } catch (error) {
          console.error(error);
          alert(`데이터베이스 오류 발생!\n(${error.message})`);
        } finally {
          setIsSending(false);
        }
      };

      if (stage === 'popping') {
        const darkLevel = bubbles.filter(b => b.hp > 0).length / 30; 
        return (
          <div className="flex flex-col items-center p-6 w-full animate-pop">
            <h2 className="text-3xl font-bold text-teal-600 bg-teal-100 px-8 py-4 rounded-full shadow-md mb-4">🪡 미션 4: 짝꿍 구출 작전</h2>
            <div className="bg-white p-6 rounded-3xl shadow-xl border-4 border-yellow-400 w-full max-w-4xl mb-6 text-center animate-bounce">
              <h3 className="text-3xl font-black text-gray-800">⚠️ 비상! 짝꿍과 태블릿을 바꾸세요!</h3>
              <p className="text-xl font-bold text-gray-600 mt-2">짝꿍의 버블들을 <span className="text-red-500">여러 번 콕콕 찔러서</span> 구출해주세요!</p>
            </div>
            <div className="relative w-full max-w-4xl bg-white rounded-[3rem] border-8 border-gray-200 h-[600px] overflow-hidden shadow-2xl transition-all duration-300">
              <div className="absolute inset-0 z-0 flex flex-wrap content-center justify-center transition-all duration-300" style={{ filter: `grayscale(${darkLevel * 100}%) blur(${darkLevel * 8}px)` }}>
                {availableTopics.slice(0, 25).map((t, i) => <span key={i} className="text-5xl m-4" style={{opacity: 1}}>{t.icon}</span>)}
              </div>
              <div className="absolute inset-0 z-10 pointer-events-none transition-all duration-300" style={{ background: `radial-gradient(circle, transparent 20%, rgba(0,0,0,${darkLevel * 0.9}) 100%)`, backdropFilter: `blur(${darkLevel * 3}px)` }}></div>
              <div className="absolute z-20 flex flex-col items-center justify-center px-10 py-4 bg-white/90 backdrop-blur-md rounded-full border-2 border-pink-200 shadow-lg top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                <span className="text-2xl font-black text-pink-600 tracking-wider">{userName}</span>
              </div>
              
              {bubbles.map(b => {
                if (b.hp <= 0) return <div key={b.id} className="absolute bubble-dead w-16 h-16 sm:w-20 sm:h-20 glass-bubble" style={{ left: `${b.x}%`, top: `${b.y}%` }}></div>;
                let hpClass = "animate-float cursor-pointer hover:scale-110 active:scale-95 transition-transform ";
                if(b.hp === 2) hpClass += "bubble-hp-2";
                if(b.hp === 1) hpClass += "bubble-hp-1";
                return (
                  <div key={b.id} onClick={() => handlePop(b.id)} className={`absolute flex items-center justify-center w-16 h-16 sm:w-20 sm:h-20 glass-bubble z-30 ${hpClass}`} style={{ left: `calc(${b.x}% - 30px)`, top: `calc(${b.y}% - 30px)` }}>
                    <span className="text-3xl sm:text-4xl pointer-events-none select-none drop-shadow-md">{b.topic.icon}</span>
                  </div>
                )
              })}

              {showPopup && (
                <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in">
                  <div className="bg-white p-10 rounded-3xl border-8 border-blue-400 shadow-2xl text-center w-11/12 max-w-xl">
                    <span className="text-7xl mb-4 block animate-bounce">⚠️</span>
                    <h3 className="text-3xl font-black text-gray-800 mb-4">버블은 깼지만, 아직 위험해요!</h3>
                    <p className="text-lg text-gray-700 font-bold leading-relaxed mb-6">
                      방금 전까지 익숙한 주제들만 시청했기 때문에,<br/>알고리즘이 심각한 <span className="text-red-500 font-black">'정보 영양실조'</span> 상태입니다.<br/><br/>
                      다시는 필터 버블이 생기지 않도록,<br/>짝꿍이 <span className="text-blue-600 font-black">일일 미디어 영양사</span>가 되어서<br/>다양하게 섞인 건강한 식판을 차려주세요!
                    </p>
                    <button onClick={() => setStage('select')} className="bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-8 rounded-2xl shadow-lg transition-all border-b-4 border-blue-700 active:translate-y-1 active:border-b-0 w-full max-w-md">👩‍⚕️ 영양 만점 식판 차려주기</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      if (stage === 'select') {
        return (
          <div className="w-full max-w-5xl animate-pop flex flex-col items-center p-6">
            <div className="bg-white p-8 rounded-3xl shadow-xl border-4 border-teal-300 w-full text-center mb-6">
              <h3 className="text-2xl font-black mb-2"><span className="text-blue-600">미디어 영양사</span>로서 {userName}에게 차려줄 <span className="text-teal-600">새로운 반찬(영상) 3가지</span>를 고르세요!</h3>
              <p className="text-sm font-bold text-teal-500 mb-6">(선택된 개수: {partnerTopics.length} / 3)</p>
              <div className="flex flex-wrap justify-center content-start gap-3 h-96 overflow-y-auto p-4 bg-gray-50 border-2 border-gray-100 rounded-xl mx-auto w-full">
                {availableTopics.map(topic => {
                  const isSel = partnerTopics.find(t=>t.id===topic.id);
                  return (
                    <button key={topic.id} onClick={() => handleSelectPartnerTopic(topic)} className={`flex flex-col items-center p-2 rounded-xl border-4 transition-all transform hover:scale-105 ${isSel ? 'border-teal-500 bg-teal-50 scale-105' : 'border-gray-200 bg-white'}`}>
                      <span className="text-3xl mb-1">{topic.icon}</span><span className="text-[10px] font-bold break-keep">{topic.label}</span>
                    </button>
                  );
                })}
              </div>
            </div>
            {partnerTopics.length === 3 && (
              <button onClick={() => setStage('write')} className="bg-teal-500 hover:bg-teal-600 text-white font-black text-xl py-4 px-12 rounded-full shadow-xl animate-bounce">처방 완료하기! ✨</button>
            )}
          </div>
        );
      }

      if (stage === 'write') {
        return (
          <div className="w-full max-w-4xl flex flex-col items-center p-6 animate-pop mx-auto">
            
            {/* 🔥 5구 식판 그래픽 (상단 3구: 짝꿍 추천, 하단 2구: 기존 취향) */}
            <div className="bg-slate-400 p-4 sm:p-8 rounded-[2.5rem] w-full mx-auto shadow-2xl mb-8">
              <div className="bg-slate-300 p-4 sm:p-6 rounded-[2rem] w-full flex flex-col gap-4 border-4 border-slate-400/50 shadow-inner">
                <div className="flex justify-center mb-2">
                  <div className="bg-white px-8 py-3 rounded-full font-black text-slate-800 shadow-md border-2 border-slate-200 text-lg">
                    <span className="text-green-600">{userName}</span>의 다양성 100% 식판
                  </div>
                </div>
                
                {/* 상단 3구 (새로운 추천 반찬 3개) */}
                <div className="flex justify-between gap-3 sm:gap-6 w-full">
                  {[partnerTopics[0], partnerTopics[1], partnerTopics[2]].map((t, idx) => (
                    <div key={idx} className="bg-green-50 border-4 border-green-200 rounded-[1.5rem] w-1/3 aspect-square flex flex-col items-center justify-center p-2 shadow-[inset_0_4px_10px_rgba(0,0,0,0.05)] relative">
                      <span className="absolute -top-3 bg-green-500 text-white text-[10px] sm:text-xs font-black px-2 py-1 rounded-full shadow-md z-10 whitespace-nowrap">✨ 친구의 추천</span>
                      <span className="text-5xl sm:text-6xl mb-2 sm:mb-4 drop-shadow-md mt-2">{t && t.icon}</span>
                      <span className="bg-white border border-green-200 rounded-full px-2 py-1 text-[10px] sm:text-sm font-bold text-green-700 w-11/12 text-center truncate shadow-sm">{t && t.label}</span>
                    </div>
                  ))}
                </div>
                
                {/* 하단 2구 (원래 취향 2개) */}
                <div className="flex justify-between gap-3 sm:gap-6 w-full mt-2">
                  {[baseTopics[0], baseTopics[1]].map((t, idx) => (
                    <div key={idx} className="bg-slate-100 border-4 border-slate-200 rounded-[2rem] w-1/2 aspect-[4/3] flex flex-col items-center justify-center p-4 shadow-[inset_0_4px_10px_rgba(0,0,0,0.05)] relative">
                      <span className="absolute -top-3 bg-slate-500 text-white text-[10px] sm:text-xs font-black px-3 py-1 rounded-full shadow-md z-10 whitespace-nowrap">🍚 원래 내 취향</span>
                      <span className="text-7xl sm:text-8xl mb-3 sm:mb-6 drop-shadow-md mt-2">{t && t.icon}</span>
                      <span className="bg-white border border-slate-200 rounded-full px-4 py-2 text-xs sm:text-base font-bold text-slate-700 w-10/12 text-center truncate shadow-sm">{t && t.label}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="bg-white p-8 rounded-3xl shadow-2xl border-4 border-blue-400 w-full mb-8">
              <h3 className="text-2xl font-black text-center mb-6 text-blue-800">📝 미디어 처방전 작성하기</h3>
              <div className="mb-6 bg-blue-50 p-4 rounded-xl border-2 border-blue-100">
                <p className="font-bold text-gray-700 text-lg">영양사(내 이름)를 적어주세요:</p>
                <input type="text" value={partnerName} onChange={e => setPartnerName(e.target.value)} placeholder="" className="w-full mt-2 p-3 border-2 border-blue-200 rounded-lg font-bold text-xl outline-none focus:border-blue-500" />
              </div>
              <div className="space-y-4 mb-8">
                <p className="font-bold text-gray-800 text-xl">{userName}에게 이 영상들을 추천해 준 이유는 무엇인가요?</p>
                <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4">
                  <p className="font-black text-blue-600 mb-2 text-lg">1) {partnerTopics[0] && partnerTopics[0].icon} {partnerTopics[0] && partnerTopics[0].label}</p>
                  <textarea value={reasons.r1} onChange={e => setReasons({...reasons, r1: e.target.value})} className="w-full p-3 rounded-lg border-2 border-gray-300 resize-none outline-none focus:border-blue-400 h-24 font-bold"></textarea>
                </div>
                <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4">
                  <p className="font-black text-blue-600 mb-2 text-lg">2) {partnerTopics[1] && partnerTopics[1].icon} {partnerTopics[1] && partnerTopics[1].label}</p>
                  <textarea value={reasons.r2} onChange={e => setReasons({...reasons, r2: e.target.value})} className="w-full p-3 rounded-lg border-2 border-gray-300 resize-none outline-none focus:border-blue-400 h-24 font-bold"></textarea>
                </div>
                <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4">
                  <p className="font-black text-blue-600 mb-2 text-lg">3) {partnerTopics[2] && partnerTopics[2].icon} {partnerTopics[2] && partnerTopics[2].label}</p>
                  <textarea value={reasons.r3} onChange={e => setReasons({...reasons, r3: e.target.value})} className="w-full p-3 rounded-lg border-2 border-gray-300 resize-none outline-none focus:border-blue-400 h-24 font-bold"></textarea>
                </div>
              </div>

              {isSending ? (
                <div className="text-center font-bold text-blue-600 py-4 bg-blue-50 rounded-xl border-2 border-blue-200 animate-pulse">서버로 안전하게 전송 중입니다... 📡</div>
              ) : (
                <PasswordUnlock checked={sendChecked} setChecked={setSendChecked} isUnlocked={false} onUnlock={handleSendToSupabase} password="wma" checkText="🚀 선생님께 전송하기" />
              )}
            </div>
          </div>
        );
      }

      if (stage === 'done') return <div className="text-center py-20 animate-pop"><h2 className="text-4xl font-black text-green-600">🎉 전송 완료! 선생님 화면을 보세요!</h2></div>;
    };

    function App() {
      const [currentStage, setCurrentStage] = useState(1);
      const [unlocked, setUnlocked] = useState({ 1: false, 2: false, 3: false, 4: false });
      const [baseTopics, setBaseTopics] = useState([]); // 2개 배열
      const [userName, setUserName] = useState('');
      
      const unlockStage = (stage) => setUnlocked(prev => ({ ...prev, [stage]: true }));
      const canGoNext = () => unlocked[currentStage];

      return (
        <div className="min-h-screen pb-32 relative">
          <header className="bg-white shadow-md p-5 sticky top-0 z-40 border-b-4 border-gray-100">
            <div className="max-w-6xl mx-auto flex justify-between items-center">
              <h1 className="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-teal-600">✨ 알고리즘 윤리</h1>
              <div className="flex gap-3">
                {[1, 2, 3, 4].map(s => (
                  <div key={s} className={`w-8 h-8 sm:w-10 sm:h-10 rounded-full flex items-center justify-center font-black text-base sm:text-lg transition-all ${currentStage === s ? "bg-blue-600 text-white scale-110 shadow-lg" : currentStage > s ? "bg-green-500 text-white" : "bg-gray-200 text-gray-500"}`}>{s}</div>
                ))}
              </div>
            </div>
          </header>
          <main className="pt-8 max-w-6xl mx-auto">
            {currentStage === 1 && <Mission1 isUnlocked={unlocked[1]} onUnlock={() => unlockStage(1)} />}
            {currentStage === 2 && <Mission2 isUnlocked={unlocked[2]} onUnlock={() => unlockStage(2)} />}
            {currentStage === 3 && <Mission3 isUnlocked={unlocked[3]} onUnlock={() => unlockStage(3)} baseTopics={baseTopics} setBaseTopics={setBaseTopics} userName={userName} setUserName={setUserName} />}
            {currentStage === 4 && <Mission4 isUnlocked={unlocked[4]} onUnlock={() => unlockStage(4)} baseTopics={baseTopics} userName={userName} />}
          </main>
          <div className="fixed bottom-0 w-full p-4 bg-white border-t-4 border-gray-200 flex justify-center z-40 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
            <button onClick={() => setCurrentStage(p => p + 1)} disabled={!canGoNext() || currentStage === 4} className={`font-black py-4 px-12 sm:py-5 sm:px-16 rounded-full text-xl sm:text-2xl shadow-xl border-b-8 transition-all duration-200 ${canGoNext() && currentStage !== 4 ? "bg-blue-600 hover:bg-blue-700 text-white active:border-b-0 active:translate-y-2 border-blue-800" : "bg-gray-200 text-gray-400 cursor-not-allowed"}`}>
              {currentStage === 4 && unlocked[4] ? '🎉 수고하셨습니다!' : (canGoNext() ? '▶ 다음 미션으로' : '임무를 완수하세요')}
            </button>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
