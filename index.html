              {/* 오른쪽: 몽타주 스크린 */}
              <div className="w-full md:w-80 bg-slate-900 rounded-3xl p-6 relative overflow-hidden flex flex-col items-center justify-center border-4 border-slate-800 shadow-inner min-h-[350px]">
                <div className="absolute inset-0" style={{backgroundImage: 'linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
                <div className="text-blue-400 font-black tracking-widest text-sm absolute top-6 z-10 flex items-center gap-2 drop-shadow-[0_0_8px_rgba(96,165,250,0.8)]"><span className="text-xl">🤖</span> DIGITAL PROFILING</div>
                
                <div className="relative z-10 flex items-center justify-center mt-8">
                  <div className="w-32 h-32 rounded-full border-2 border-blue-500/30 flex items-center justify-center absolute animate-pulse-slow"></div>
                  <div className="text-[100px] text-blue-500 drop-shadow-[0_0_15px_rgba(59,130,246,0.6)]">👤</div>
                  
                  {/* 부착된 라벨들 */}
                  {montageItems.map((item, idx) => (
                    <div key={idx} className="absolute animate-fade-in bg-slate-800/80 backdrop-blur-sm border border-blue-400/50 text-blue-100 px-3 py-1.5 rounded-lg text-xs font-bold shadow-[0_0_10px_rgba(96,165,250,0.3)] flex items-center gap-1.5 whitespace-nowrap break-keep" 
                         style={{ 
                           top: `${20 + (idx % 3) * 30}%`, 
                           left: idx % 2 === 0 ? '-60%' : '110%',
                           transform: `rotate(${idx % 2 === 0 ? -5 : 5}deg)`
                         }}>
                      <span className="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_5px_#4ade80]"></span> {item.icon} {item.label}
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>
        );
      }

      if (step === 3) {
        const isTrapped = clickCount >= 10;
        const bgTopics = allTopics.filter(t => !selectedTopics.includes(t.label));
        const activeTopic1 = allTopics.find(t => t.label === selectedTopics[0]);
        const activeTopic2 = allTopics.find(t => t.label === selectedTopics[1]);

        return (
          <div className="relative min-h-screen overflow-hidden flex flex-col items-center justify-center bg-white transition-colors duration-1000" style={{ backgroundColor: isTrapped ? '#0f172a' : 'white' }}>
            {/* 배경 주제들 (가장자리 꽉 채우기) */}
            {bgTopics.map((topic, i) => (
              <div key={i} className="absolute text-3xl opacity-30 transition-all duration-1000"
                style={{
                  top: `${(i * 7) % 95}%`,
                  left: `${(i * 13) % 95}%`,
                  filter: isTrapped ? 'grayscale(100%) opacity(0.1) blur(4px)' : 'none',
                  transform: `rotate(${i * 15}deg)`
                }}>
                {topic.icon}
              </div>
            ))}

            {/* 필터버블 UI */}
            <div className={`relative z-10 transition-all duration-1000 flex flex-col items-center justify-center ${isTrapped ? 'scale-110' : 'scale-100'}`}>
              <div className="absolute w-[400px] h-[400px] rounded-full border-4 transition-all duration-1000"
                style={{
                  borderColor: isTrapped ? 'rgba(59, 130, 246, 0.8)' : 'transparent',
                  background: isTrapped ? 'radial-gradient(circle, rgba(59,130,246,0.1) 0%, rgba(15,23,42,0.8) 100%)' : 'transparent',
                  boxShadow: isTrapped ? '0 0 50px rgba(59, 130, 246, 0.5), inset 0 0 30px rgba(59, 130, 246, 0.5)' : 'none'
                }}>
              </div>

              {!isTrapped ? (
                <div className="bg-white/90 backdrop-blur p-8 rounded-3xl shadow-xl max-w-md w-full text-center z-20 border-2 border-slate-100">
                  <h2 className="text-2xl font-black mb-6 text-slate-800 break-keep">내가 가장 좋아하는 주제<br/>2가지를 고르세요!</h2>
                  {selectedTopics.length < 2 ? (
                    <div className="h-[400px] overflow-y-auto grid grid-cols-2 gap-3 pr-2 custom-scrollbar">
                      {allTopics.map(topic => (
                        <button key={topic.id} onClick={() => setSelectedTopics([...selectedTopics, topic.label])} className="p-3 border-2 border-slate-200 rounded-xl hover:border-blue-500 hover:bg-blue-50 transition-all flex flex-col items-center gap-2">
                          <span className="text-4xl">{topic.icon}</span>
                          <span className="text-xs font-bold text-slate-600 break-keep">{topic.label}</span>
                        </button>
                      ))}
                    </div>
                  ) : (
                    <div className="animate-fade-in">
                      <p className="text-lg font-bold text-slate-600 mb-6 break-keep">선택한 주제의 영상을<br/>계속 터치해서 시청하세요! ({clickCount}/10)</p>
                      <div className="flex gap-4 justify-center mb-6">
                        <button onClick={() => setClickCount(c => c + 1)} className="text-6xl hover:scale-110 active:scale-95 transition-transform bg-slate-50 p-6 rounded-3xl border-4 border-slate-200 shadow-sm">
                          {activeTopic1.icon}
                        </button>
                        <button onClick={() => setClickCount(c => c + 1)} className="text-6xl hover:scale-110 active:scale-95 transition-transform bg-slate-50 p-6 rounded-3xl border-4 border-slate-200 shadow-sm">
                          {activeTopic2.icon}
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              ) : (
                <div className="z-20 text-center animate-fade-in p-8">
                  <div className="flex justify-center gap-4 mb-4">
                    <span className="text-7xl drop-shadow-[0_0_15px_rgba(255,255,255,0.5)] animate-float" style={{animationDelay: '0s'}}>{activeTopic1.icon}</span>
                    <span className="text-7xl drop-shadow-[0_0_15px_rgba(255,255,255,0.5)] animate-float" style={{animationDelay: '1s'}}>{activeTopic2.icon}</span>
                  </div>
                  <h1 className="text-4xl font-black text-white mb-4 drop-shadow-md break-keep">필터 버블에 갇혔습니다!</h1>
                  <p className="text-blue-200 font-bold mb-8 text-lg break-keep leading-relaxed">
                    선호하는 정보만 계속 선택하다 보니,<br/>세상의 다른 유익한 정보들은 흑백으로 흐려지고<br/>나만의 좁은 방울(버블)에 갇히게 되었습니다.
                  </p>
                  
                  <div className="bg-slate-800/80 p-6 rounded-2xl border border-slate-600 backdrop-blur-md">
                    <p className="text-yellow-300 font-black mb-4 break-keep">🚨 짝꿍과 태블릿을 바꾸고, 짝꿍을 구출하세요!</p>
                    <input 
                      type="password" 
                      value={password}
                      onChange={e => setPassword(e.target.value)}
                      placeholder="구출 암호 입력"
                      className="w-full max-w-[200px] box-border text-center text-xl p-4 border-2 border-slate-600 rounded-xl mb-4 font-black bg-slate-900 text-white focus:border-blue-500 focus:outline-none"
                    />
                    <button 
                      onClick={() => {
                        if(password === "fl") { setStep(4); setPassword(""); }
                        else alert("❌ 암호가 틀렸습니다!");
                      }}
                      className="w-full bg-blue-500 hover:bg-blue-600 text-white font-black py-4 rounded-xl transition-colors text-lg"
                    >
                      버블 터뜨리기! 💥
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      if (step === 4) {
        const handleNewTopicChange = (index, value) => {
          const arr = [...newTopics]; arr[index] = value; setNewTopics(arr);
        };
        const handleReasonChange = (index, value) => {
          const arr = [...reasons]; arr[index] = value; setReasons(arr);
        };

        const submitTray = async () => {
          if (!partnerName || newTopics.some(t => !t) || reasons.some(r => !r)) {
            alert("모든 칸을 꼼꼼하게 채워주세요!"); return;
          }
          if (window.confirm("식판을 선생님 대시보드로 전송할까요?")) {
            setIsSubmitting(true);
            try {
              const baseTopicString = selectedTopics.join('|'); // 두 개의 기존 주제 묶어서 전송
              const { error } = await supabase.from('media_trays').insert([{
                user_name: '짝꿍',
                partner_name: partnerName,
                base_topic: baseTopicString,
                topic_1: newTopics[0], reason_1: reasons[0],
                topic_2: newTopics[1], reason_2: reasons[1],
                topic_3: newTopics[2], reason_3: reasons[2]
              }]);
              if (error) throw error;
              alert("전송 완료! 선생님 화면을 확인하세요.");
              window.location.reload();
            } catch (err) {
              alert("에러가 발생했습니다: " + err.message);
              setIsSubmitting(false);
            }
          }
        };

        const activeTopic1 = allTopics.find(t => t.label === selectedTopics[0]) || {icon:'❔'};
        const activeTopic2 = allTopics.find(t => t.label === selectedTopics[1]) || {icon:'❔'};

        return (
          <div className="min-h-screen bg-slate-50 p-4 sm:p-8 relative overflow-hidden flex flex-col items-center">
            {/* 꽉 찬 배경 주제들 */}
            {allTopics.filter(t => !selectedTopics.includes(t.label)).map((topic, i) => (
              <div key={i} className="absolute text-4xl opacity-20"
                style={{ top: `${(i * 7) % 95}%`, left: `${(i * 13) % 95}%`, transform: `rotate(${i * 15}deg)` }}>
                {topic.icon}
              </div>
            ))}

            <div className="max-w-4xl mx-auto w-full flex flex-col gap-8 relative z-10 animate-fade-in">
              <div className="bg-white p-6 md:p-8 rounded-3xl shadow-lg border-2 border-slate-200 text-center mx-auto w-full">
                <h1 className="text-3xl font-black text-slate-800 mb-2 break-keep">👨‍⚕️ 일일 미디어 영양사 활동</h1>
                <p className="text-slate-500 font-bold break-keep">짝꿍의 시야를 넓혀줄 새롭고 건강한 주제 3가지를 골라 처방전을 완성하세요!</p>
                <div className="mt-6">
                  <input type="text" value={partnerName} onChange={e => setPartnerName(e.target.value)} placeholder="영양사(내 이름) 입력" className="text-center font-black text-xl p-3 border-b-4 border-slate-300 focus:border-blue-500 focus:outline-none bg-slate-50 rounded-t-lg w-full max-w-xs mx-auto block" />
                </div>
              </div>

              {/* 5구 식판 UI (상단 추천 3개, 하단 기존취향 2개) */}
              <div className="bg-slate-300 p-4 md:p-8 rounded-[2rem] shadow-inner border-4 border-slate-400 w-full mx-auto">
                <div className="flex justify-center mb-6">
                  <div className="bg-white px-6 py-2 rounded-full font-black text-slate-700 shadow-sm border-2 border-slate-200 flex items-center gap-2">
                    <span className="text-xl">🍱</span> 짝꿍의 다양성 100% 식판
                  </div>
                </div>

                <div className="flex flex-col md:flex-row gap-6 w-full mb-6">
                  {[0, 1, 2].map(idx => (
                    <div key={idx} className="flex-1 bg-white rounded-2xl p-4 shadow-md border-2 border-green-300 relative group transition-all focus-within:ring-4 ring-green-200 flex flex-col">
                      <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-green-500 text-white text-xs font-black px-3 py-1 rounded-full shadow-md z-10 whitespace-nowrap">✨ 짝꿍의 추천 {idx + 1}</div>
                      
                      <select value={newTopics[idx]} onChange={e => handleNewTopicChange(idx, e.target.value)} className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold text-slate-700 focus:outline-none focus:border-green-400 mb-3 cursor-pointer mt-3">
                        <option value="">+ 반찬 선택하기</option>
                        {allTopics.map(t => <option key={t.id} value={t.label}>{t.icon} {t.label}</option>)}
                      </select>
                      
                      <textarea value={reasons[idx]} onChange={e => handleReasonChange(idx, e.target.value)} placeholder="왜 이 주제를 추천하나요? (예: 게임만 하지 말고 운동도 하면 좋겠어!)" className="w-full flex-1 p-3 bg-slate-50 border-2 border-slate-200 rounded-xl font-bold text-slate-600 focus:outline-none focus:border-green-400 resize-none min-h-[100px] text-sm leading-relaxed" />
                    </div>
                  ))}
                </div>

                {/* 하단 기존 취향 2구 */}
                <div className="flex gap-4 md:gap-6 justify-center max-w-2xl mx-auto w-full">
                  <div className="flex-1 bg-slate-50 rounded-2xl p-6 shadow-inner border-4 border-slate-200 flex flex-col items-center justify-center relative">
                    <div className="absolute -top-3 bg-slate-500 text-white text-xs font-black px-4 py-1 rounded-full shadow-md whitespace-nowrap">🍚 원래 내 취향</div>
                    <span className="text-6xl md:text-7xl mb-3 drop-shadow-sm mt-3">{activeTopic1.icon}</span>
                    <span className="bg-white border border-slate-200 rounded-full px-4 py-2 font-bold text-slate-700 text-sm md:text-base break-keep text-center w-full shadow-sm">{activeTopic1.label}</span>
                  </div>
                  <div className="flex-1 bg-slate-50 rounded-2xl p-6 shadow-inner border-4 border-slate-200 flex flex-col items-center justify-center relative">
                    <div className="absolute -top-3 bg-slate-500 text-white text-xs font-black px-4 py-1 rounded-full shadow-md whitespace-nowrap">🍚 원래 내 취향</div>
                    <span className="text-6xl md:text-7xl mb-3 drop-shadow-sm mt-3">{activeTopic2.icon}</span>
                    <span className="bg-white border border-slate-200 rounded-full px-4 py-2 font-bold text-slate-700 text-sm md:text-base break-keep text-center w-full shadow-sm">{activeTopic2.label}</span>
                  </div>
                </div>
              </div>

              <button disabled={isSubmitting} onClick={submitTray} className="w-full md:w-auto mx-auto px-12 py-5 bg-slate-800 hover:bg-black text-white rounded-2xl font-black text-2xl shadow-xl transition-all disabled:opacity-50">
                {isSubmitting ? "전송 중..." : "🚀 처방 완료하고 선생님께 보내기"}
              </button>
            </div>
          </div>
        );
      }

      return null;
    }

    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
